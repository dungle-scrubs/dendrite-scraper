<!--
  github-brandkit mark template.

  Square. Solid colour ground with a Lucide glyph in white.
  viewBox 1024 so the same source rasterizes crisply to 512 and 1024.

  Tokens filled by render.ts:
    #047857         ground fill (hand-assigned per project)
    #FFFFFF    icon stroke (#FFFFFF by default)
    228    corner radius
    234     icon group translate X (centred)
    234     icon group translate Y (centred)
    23.167 icon group scale (iconPx / 24)
    <circle cx="12" cy="12" r="10" />
  <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
  <path d="M2 12h20" />     Lucide inner SVG nodes (paths/circles), stroke inherited
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="#047857"/>
  <g transform="translate(234 234) scale(23.167)"
     fill="none" stroke="#FFFFFF" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
  <path d="M2 12h20" /></g>
</svg>
